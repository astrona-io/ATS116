# Knowledge check for module module-02 of section 010. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats116-010-m02
course_id: ATS116
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: module-02
  title: "Tokens, Permissions And Server State Over HTTP"
placement:
  position: after
  reading: sections/section-010/module-02/course-05-summary.md
questions:
- id: ats116-010-m02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Read the limits of a token"
  source_readings:
  - sections/section-010/module-02/course-01-the-token-lifecycle.md
  prompt: "Which request shows how many uses a token has left?"
  options:
  - id: a
    text: "A GET on `auth/token/lookup-self` with the token in the header."
    explanation: "Correct. The lookup shows the policies, the time left and the uses left of the token."
  - id: b
    text: "A GET on `sys/health`."
    explanation: "It reports the server state and says nothing about a token."
  - id: c
    text: "A POST to `sys/capabilities-self`."
    explanation: "It reports what the token may do on a path, not how many uses are left."
  - id: d
    text: "A POST to `auth/token/renew-self`."
    explanation: "It extends the token and does not show its limits."
  correct_option: a
  explanation: "Correct. The lookup shows the policies, the time left and the uses left of the token."
- id: ats116-010-m02-q02
  type: single_choice
  difficulty: beginner
  learning_objective: "Renew a token"
  source_readings:
  - sections/section-010/module-02/course-01-the-token-lifecycle.md
  prompt: "A token has a maximum TTL of one hour. What limits a call to `renew-self`?"
  options:
  - id: a
    text: "Nothing, a token can be renewed without end."
    explanation: "Not correct. Only periodic tokens renew without a maximum."
  - id: b
    text: "The number of policies on the token."
    explanation: "Not correct. Policies do not change how long a token can live."
  - id: c
    text: "The maximum TTL: the token cannot live longer than that, however often it is renewed."
    explanation: "Correct. Renewal extends a token only up to its maximum TTL. Periodic tokens are the exception."
  - id: d
    text: "The TTL of the root token."
    explanation: "Not correct. The root token does not set the limit of other tokens."
  correct_option: c
  explanation: "Correct. Renewal extends a token only up to its maximum TTL. Periodic tokens are the exception."
- id: ats116-010-m02-q03
  type: single_choice
  difficulty: beginner
  learning_objective: "Create a limited child token"
  source_readings:
  - sections/section-010/module-02/course-01-the-token-lifecycle.md
  prompt: "A parent token holds only the policy `inventory-reader`. A request asks it to create a child with `inventory-reader` and `inventory-writer`. What happens?"
  options:
  - id: a
    text: "The child is created with both policies."
    explanation: "Not correct. That would let a token raise its own rights."
  - id: b
    text: "OpenBao refuses, because a child can only have policies its parent has."
    explanation: "Correct. A non-root parent cannot hand out rights it does not hold."
  - id: c
    text: "The child is created with `inventory-reader` only and no error."
    explanation: "Not correct. OpenBao refuses the request instead of dropping a policy."
  - id: d
    text: "The parent token is revoked."
    explanation: "Not correct. A refused request does not revoke the parent."
  correct_option: b
  explanation: "Correct. A non-root parent cannot hand out rights it does not hold."
- id: ats116-010-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain the parent and child relationship"
  source_readings:
  - sections/section-010/module-02/course-01-the-token-lifecycle.md
  prompt: "What happens to the children of a token when the token is revoked?"
  options:
  - id: a
    text: "They stay valid until their own TTL ends."
    explanation: "Not correct. Revocation follows the parent and child relationship."
  - id: b
    text: "They become root tokens."
    explanation: "Not correct. Revocation never raises the rights of a token."
  - id: c
    text: "They are renewed once."
    explanation: "Not correct. Revocation does not renew anything."
  - id: d
    text: "They are revoked with it."
    explanation: "Correct. A revoked parent takes its children with it, unless a child is an orphan."
  correct_option: d
  explanation: "Correct. A revoked parent takes its children with it, unless a child is an orphan."
- id: ats116-010-m02-q05
  type: single_choice
  difficulty: beginner
  learning_objective: "Tell the token types apart"
  source_readings:
  - sections/section-010/module-02/course-01-the-token-lifecycle.md
  prompt: "A script must renew a token every few minutes. Why does a batch token not fit?"
  options:
  - id: a
    text: "A batch token has no policies."
    explanation: "Not correct. A batch token carries policies like other tokens."
  - id: b
    text: "A batch token works only on `sys/health`."
    explanation: "Not correct. It works on any path its policies allow."
  - id: c
    text: "A batch token cannot be renewed."
    explanation: "Correct. Batch tokens are cheap and fixed in lifetime and cannot be renewed."
  - id: d
    text: "A batch token can be used only once."
    explanation: "Not correct. The use limit is set separately."
  correct_option: c
  explanation: "Correct. Batch tokens are cheap and fixed in lifetime and cannot be renewed."
- id: ats116-010-m02-q06
  type: single_choice
  difficulty: beginner
  learning_objective: "Ask for the capabilities of a token"
  source_readings:
  - sections/section-010/module-02/course-02-finding-out-what-a-token-can-do.md
  prompt: "A request answers `403`. Which request tells you what the token may do on the exact path?"
  options:
  - id: a
    text: "A POST to `sys/capabilities-self` with the path in the body."
    explanation: "Correct. It returns the capabilities of the token on that path, which turns a `403` into a concrete missing capability."
  - id: b
    text: "A GET on `sys/health`."
    explanation: "Not correct. It reports server state."
  - id: c
    text: "A GET on `auth/token/lookup-self`."
    explanation: "Not correct. It lists the policies but not the result for one path."
  - id: d
    text: "A POST to `sys/wrapping/lookup`."
    explanation: "Not correct. It inspects a wrapping token."
  correct_option: a
  explanation: "Correct. It returns the capabilities of the token on that path, which turns a `403` into a concrete missing capability."
- id: ats116-010-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Write a KV version 2 policy path"
  source_readings:
  - sections/section-010/module-02/course-02-finding-out-what-a-token-can-do.md
  prompt: "A KV version 2 secret is read at `secret/inventory/config`. Which path does the policy rule need?"
  options:
  - id: a
    text: "`secret/inventory/config`"
    explanation: "Not correct. That is the KV version 1 form."
  - id: b
    text: "`secret/metadata/inventory/config` only"
    explanation: "Not correct. That rule covers metadata, not the value."
  - id: c
    text: "`sys/policies/acl/inventory`"
    explanation: "Not correct. That path reads a policy, not the secret."
  - id: d
    text: "`secret/data/inventory/config`"
    explanation: "Correct. KV version 2 rules must name the `data/` path for reads and the `metadata/` path for listing and metadata."
  correct_option: d
  explanation: "Correct. KV version 2 rules must name the `data/` path for reads and the `metadata/` path for listing and metadata."
- id: ats116-010-m02-q08
  type: single_choice
  difficulty: beginner
  learning_objective: "Read the status codes of sys/health"
  source_readings:
  - sections/section-010/module-02/course-03-server-state-health-and-error-codes.md
  prompt: "A load balancer calls `sys/health` and gets `503`. What does that mean?"
  options:
  - id: a
    text: "The server is a standby node."
    explanation: "Not correct. A standby answers `429`."
  - id: b
    text: "The server is sealed."
    explanation: "Correct. `sys/health` answers `200` active, `429` standby, `501` uninitialized and `503` sealed."
  - id: c
    text: "The server is not initialized."
    explanation: "Not correct. That answers `501`."
  - id: d
    text: "The token is missing."
    explanation: "Not correct. The health endpoint needs no token."
  correct_option: b
  explanation: "Correct. `sys/health` answers `200` active, `429` standby, `501` uninitialized and `503` sealed."
- id: ats116-010-m02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Choose which errors to retry"
  source_readings:
  - sections/section-010/module-02/course-03-server-state-health-and-error-codes.md
  prompt: "A client gets `503` from OpenBao once and `403` from another request. Which should it retry?"
  options:
  - id: a
    text: "Both, with the same token."
    explanation: "Not correct. A `403` repeats until the policy or token changes."
  - id: b
    text: "Only the `403`."
    explanation: "Not correct. The `403` is a permission problem, not a temporary one."
  - id: c
    text: "The `503`, because the server may be ready later. The `403` will fail again."
    explanation: "Correct. Retry `5xx` and `429`. A `4xx` means the request itself must change."
  - id: d
    text: "Neither, both are permanent."
    explanation: "Not correct. A sealed or starting server comes back."
  correct_option: c
  explanation: "Correct. Retry `5xx` and `429`. A `4xx` means the request itself must change."
- id: ats116-010-m02-q10
  type: single_choice
  difficulty: beginner
  learning_objective: "Print the request behind a bao command"
  source_readings:
  - sections/section-010/module-02/course-04-the-bao-command-as-an-http-client.md
  prompt: "Which flag prints the HTTP request behind a `bao` command?"
  options:
  - id: a
    text: "`-format=json`"
    explanation: "Not correct. It only changes how the answer is printed."
  - id: b
    text: "`-output-curl-string`"
    explanation: "Correct. It prints the `curl` command instead of sending the request."
  - id: c
    text: "`-field`"
    explanation: "Not correct. It selects one field of the answer."
  - id: d
    text: "`-policy`"
    explanation: "Not correct. It is not a flag for printing requests."
  correct_option: b
  explanation: "Correct. It prints the `curl` command instead of sending the request."
