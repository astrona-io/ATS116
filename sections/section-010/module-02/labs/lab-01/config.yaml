# Issue A Limited Token For A Reporting Job
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-010-02-setup"
      description: "Creates the starting state in `api-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-token-scoped"
      description: "the token in Secret report-token has only inventory-lister (and default), not root"
      type: "file"
      source: "validation/validate-token-scoped.sh"
    - name: "validate-token-limits"
      description: "the token has a 15 minute TTL and five uses, and has not been used"
      type: "file"
      source: "validation/validate-token-limits.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
