# Hand Over A Secret With A Wrapped Response
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-010-01-setup"
      description: "Creates the starting state in `api-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-secret-written"
      description: "secret/inventory/api holds the expected api_key"
      type: "file"
      source: "validation/validate-secret-written.sh"
    - name: "validate-written-by-deployer"
      description: "the audit log shows deployer, not root, writing secret/inventory/api"
      type: "file"
      source: "validation/validate-written-by-deployer.sh"
    - name: "validate-wrapping-token"
      description: "Secret handover holds an unused wrapping token for secret/data/inventory/api with a 10 minute TTL"
      type: "file"
      source: "validation/validate-wrapping-token.sh"

teardown:
  keepCluster: false
