# Repair A Script That Calls The OpenBao API
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-capstone-010-setup"
      description: "Creates the starting state in `apicapstone` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-report-runs"
      description: "a Job from the inventory-report CronJob completes and reports every key"
      type: "file"
      source: "validation/validate-report-runs.sh"
    - name: "validate-approle-only"
      description: "the script still logs in with AppRole and holds no token"
      type: "file"
      source: "validation/validate-approle-only.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
