# Render A JSON File With An Agent Template
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-020-03-setup"
      description: "Creates the starting state in `agent-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-json-served"
      description: "/config.json is valid JSON with the three fields and the current KV version"
      type: "file"
      source: "validation/validate-json-served.sh"
    - name: "validate-env-still-served"
      description: "The original /config file is still rendered with current values"
      type: "file"
      source: "validation/validate-env-still-served.sh"
    - name: "validate-json-rerender"
      description: "A new KV version reaches /config.json within 90 seconds without a pod restart"
      type: "file"
      source: "validation/validate-json-rerender.sh"
    - name: "validate-no-static-token"
      description: "No token is stored in the Deployment or its ConfigMaps"
      type: "file"
      source: "validation/validate-no-static-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
