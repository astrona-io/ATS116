# Hand An Agent A Wrapped Secret ID
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-020-02-setup"
      description: "Creates the starting state in `agent-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-role-limits"
      description: "AppRole nightly has inventory-reader, a 10 minute one-use secret ID and a 20 minute token"
      type: "file"
      source: "validation/validate-role-limits.sh"
    - name: "validate-wrapped-secret-id"
      description: "Secret nightly-approle holds the role ID and an unused 5 minute wrapped secret ID"
      type: "file"
      source: "validation/validate-wrapped-secret-id.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
