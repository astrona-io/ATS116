# Repair Secret Injection For The Inventory App
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-capstone-040-setup"
      description: "Creates the starting state in `injectcapstone` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-pod-injected"
      description: "the running inventory pod has the injected agent init container and sidecar"
      type: "file"
      source: "validation/validate-pod-injected.sh"
    - name: "validate-app-serves-config"
      description: "the inventory app serves the rendered configuration with the current secret"
      type: "file"
      source: "validation/validate-app-serves-config.sh"
    - name: "validate-rerender"
      description: "a new KV version reaches the app within 90 seconds, with no restart"
      type: "file"
      source: "validation/validate-rerender.sh"
    - name: "validate-app-unchanged"
      description: "the app container still runs nginx:1.27-alpine with its default command"
      type: "file"
      source: "validation/validate-app-unchanged.sh"
    - name: "validate-role-scoped"
      description: "the Kubernetes auth role inventory is bound to inventory in injectcapstone with only inventory-reader"
      type: "file"
      source: "validation/validate-role-scoped.sh"

teardown:
  keepCluster: false
