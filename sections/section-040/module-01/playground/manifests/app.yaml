apiVersion: v1
kind: Namespace
metadata:
  name: inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: inventory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: inventory
data:
  default.conf: |
    server {
      listen 80;
      location = /config {
        default_type text/plain;
        alias /vault/secrets/config.env;
      }
      location = /healthz {
        return 200 "ok";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: inventory
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "inventory"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/inventory/config"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/inventory/config" -}}
          DB_HOST={{ .Data.data.db_host }}
          DB_USER={{ .Data.data.db_user }}
          API_KEY={{ .Data.data.api_key }}
          {{- end }}
        vault.hashicorp.com/template-static-secret-render-interval: "15s"
    spec:
      serviceAccountName: inventory
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 80
      targetPort: 80
