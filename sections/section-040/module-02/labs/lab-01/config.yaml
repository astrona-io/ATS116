# Inject A Second Secret As A JSON File
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-040-02-setup"
      description: "Creates the starting state in `inventory` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-pod-injected"
      description: "The running pod has the injected vault-agent-init and vault-agent containers"
      type: "file"
      source: "validation/validate-pod-injected.sh"
    - name: "validate-api-file-name"
      description: "/vault/secrets holds api.json and config.env"
      type: "file"
      source: "validation/validate-api-file-name.sh"
    - name: "validate-api-json-served"
      description: "/api is valid JSON with the current api_url, api_token and numeric version"
      type: "file"
      source: "validation/validate-api-json-served.sh"
    - name: "validate-config-still-served"
      description: "/config still shows the current first secret"
      type: "file"
      source: "validation/validate-config-still-served.sh"
    - name: "validate-api-rerender"
      description: "A new version of the second secret reaches /api within 90 seconds in the same pod"
      type: "file"
      source: "validation/validate-api-rerender.sh"
    - name: "validate-role-scoped"
      description: "The role inventory is bound only to inventory in inventory with inventory-reader"
      type: "file"
      source: "validation/validate-role-scoped.sh"
    - name: "validate-app-unchanged"
      description: "The app container is unchanged"
      type: "file"
      source: "validation/validate-app-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
