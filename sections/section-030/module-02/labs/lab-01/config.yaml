# Make The Proxy Use Its Own Token
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-lab-030-02-setup"
      description: "Creates the starting state in `proxy-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-app-reads-through-proxy"
      description: "/config returns the current inventory secret"
      type: "file"
      source: "validation/validate-app-reads-through-proxy.sh"
    - name: "validate-proxy-replaces-token"
      description: "The proxy replaces a caller's token with its own"
      type: "file"
      source: "validation/validate-proxy-replaces-token.sh"
    - name: "validate-nginx-unchanged"
      description: "The nginx configuration is unchanged"
      type: "file"
      source: "validation/validate-nginx-unchanged.sh"
    - name: "validate-app-unchanged"
      description: "The app container is unchanged"
      type: "file"
      source: "validation/validate-app-unchanged.sh"
    - name: "validate-proxy-local-only"
      description: "Only containers in the pod can reach the proxy"
      type: "file"
      source: "validation/validate-proxy-local-only.sh"
    - name: "validate-role-scoped"
      description: "The role inventory-proxy is still scoped to the one service account with inventory-reader"
      type: "file"
      source: "validation/validate-role-scoped.sh"
    - name: "validate-no-static-token"
      description: "No token is stored in the Deployment or the proxy configuration"
      type: "file"
      source: "validation/validate-no-static-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
