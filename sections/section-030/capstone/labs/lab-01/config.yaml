# Move An App From A Static Token To OpenBao Proxy
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-116-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs the bao CLI and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-116-capstone-030-setup"
      description: "Creates the starting state in `proxycapstone` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers as an unsealed active node"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-app-reads-through-proxy"
      description: "the app returns the inventory secret through the proxy, with no token of its own"
      type: "file"
      source: "validation/validate-app-reads-through-proxy.sh"
    - name: "validate-old-token-revoked"
      description: "the long-lived token is revoked"
      type: "file"
      source: "validation/validate-old-token-revoked.sh"
    - name: "validate-no-static-token"
      description: "no OpenBao token is written into the inventory pod spec or its ConfigMaps"
      type: "file"
      source: "validation/validate-no-static-token.sh"
    - name: "validate-proxy-local-only"
      description: "the proxy port 8100 cannot be reached from outside the pod"
      type: "file"
      source: "validation/validate-proxy-local-only.sh"
    - name: "validate-role-scoped"
      description: "the Kubernetes auth role inventory-proxy is bound to inventory-proxy in proxycapstone with only inventory-reader"
      type: "file"
      source: "validation/validate-role-scoped.sh"
    - name: "validate-app-unchanged"
      description: "the app container still runs nginx:1.27-alpine with its default command"
      type: "file"
      source: "validation/validate-app-unchanged.sh"

teardown:
  keepCluster: false
