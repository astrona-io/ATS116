apiVersion: v1
kind: Namespace
metadata:
  name: proxycapstone
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: proxycapstone
data:
  default.conf: |
    server {
      listen 80;
      location = /config {
        proxy_pass http://openbao.openbao.svc:8200/v1/secret/data/inventory/config;
        proxy_set_header X-Vault-Token "@STATIC_TOKEN@";
      }
      location = /healthz {
        return 200 "ok";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: proxycapstone
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: proxycapstone
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 80
      targetPort: 80
