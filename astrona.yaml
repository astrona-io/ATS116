        path: sections/section-040/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair Secret Injection For The Inventory App Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: injector
        task_kind: troubleshooting
        tags: [agent-injector, annotations, agent-template, service-account, kubernetes-auth, pre-populate]
        learning_goals:
          - Find why pods are not injected, or why their init container never finishes
          - Fix the annotations, the role binding and the template without changing the application
          - Prove the rendered secret is served and follows a new secret version
        resources:
          - name: "Agent sidecar injector"
            url: https://openbao.org/docs/platform/k8s/injector/
          - name: "Injector examples"
            url: https://openbao.org/docs/platform/k8s/injector/examples/
          - name: "OpenBao Agent templates"
            url: https://openbao.org/docs/agent-and-proxy/agent/template/
