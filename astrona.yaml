        task_kind: build
        tags: [agent-injector, annotations, agent-template, kubernetes-auth, service-account, zero-code-change]
        learning_goals:
          - Bind a Kubernetes auth role to the application's service account with a read-only policy
          - Annotate the pod template so the injector renders the configuration into /vault/secrets
          - Prove the application serves the secret and picks up a new version with no image or command change
        resources:
          - name: "Agent sidecar injector"
            url: https://openbao.org/docs/platform/k8s/injector/
          - name: "Injector annotations"
            url: https://openbao.org/docs/platform/k8s/injector/annotations/
          - name: "Kubernetes auth method"
            url: https://openbao.org/docs/auth/kubernetes/
      - type: reading
        title: "Troubleshooting Injection"
        path: sections/section-040/module-01/course-03-troubleshooting-injection.md
      - type: reading
